<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="portofolio.css">
<link rel="stylesheet" href="navbar.css">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="ikon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<title>Portofolio</title>
</head>

<body>

<div class="header"></div>

<div class="container">
  <div class="card">

    <div class="top">
      <div class="avatar" id="avatar"></div>
      <div class="name" id="namaUser">-</div>
    </div>

    <div class="balance">
      <div class="label">Total Investasi</div>
      <div class="amount" id="totalInvestasi">Rp 0</div>
    </div>

    <div class="return-box">
      <div>
        <div class="label">Return</div>
        <div class="amount small" id="totalReturn">Rp 0</div>
      </div>

      <div class="badge" id="percentReturn">0%</div>
    </div>

  </div>
  <!-- ================= TAB MENU ================= -->
  <div class="tab-menu" id="tabMenu">
    <div class="tab-indicator" id="tabIndicator"></div>
    <div class="tab-item active" onclick="switchTab('roi')">
      <div class="icon">
        <!-- ROI -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 17l6-6 4 4 7-7v6h2V4h-10v2h6l-5 5-4-4-8 8z"/>
        </svg>
      </div>
      <span>ROI</span>
    </div>
  
    <div class="tab-item" onclick="switchTab('statement')">
      <div class="icon">
        <!-- Statement -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 4h16v2H4zm0 4h16v2H4zm0 4h10v2H4zm0 4h10v2H4z"/>
        </svg>
      </div>
      <span>Statement</span>
    </div>
  
    <div class="tab-item" onclick="switchTab('valuasi')">
      <div class="icon">
        <!-- Valuasi -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 3h2v18H3zm4 10h2v8H7zm4-6h2v14h-2zm4 4h2v10h-2zm4-8h2v18h-2z"/>
        </svg>
      </div>
      <span>Valuasi</span>
    </div>
  
  </div>
  
  <!-- ================= TAB CONTENT ================= -->
  <!-- ================= TAB CONTENT ================= -->
  <div class="tab-content">
  
    <div id="tabWrapper">
  
      <div class="tab-pane">
        <div id="roiList"></div>
      </div>
  
      <div class="tab-pane">
        <div id="statementList"></div>
      </div>
  
      <div class="tab-pane">
        <h3>Maintenance</h3>
      </div>
  
    </div>
  
  </div>
</div>
<div id="navbar-container"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="navbar.js"></script>
<script src="portofolio.js"></script>
</body>
</html>
