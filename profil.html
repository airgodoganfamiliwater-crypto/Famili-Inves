<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="profil.css">
<link rel="stylesheet" href="navbar.css">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="ikon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<title>Profil</title>

</head>

<body>

<div class="header"></div>

<div class="profile-card">

  <div class="avatar-wrap">
    <div class="avatar" id="avatar"></div>

    <div class="edit-btn" id="openPopup">
      ✎
    </div>
  </div>

  <div class="nama" id="namaUser">-</div>

</div>
<div class="detail-card">

  <div class="detail-title">Profil Lengkap</div>

  <div class="detail-row">
    <span>Nama</span>
    <b id="dNama">-</b>
  </div>

  <div class="detail-row">
    <span>Email</span>
    <b id="dEmail">-</b>
  </div>

  <div class="detail-row">
    <span>Total Investasi</span>
    <b id="dInvestasi">-</b>
  </div>

  <div class="detail-row">
    <span>Kepemilikan</span>
    <b id="dAsset">-</b>
  </div>

  <div class="detail-row">
    <span>Rekening</span>
    <b id="dRek">-</b>
  </div>

</div>
<div class="btn-wrap">
  <button class="btn logout-btn" id="btnLogout">
    Logout
  </button>
</div>
<!-- ===== POPUP ===== -->
<div class="popup" id="popup">

  <div class="popup-box" id="popupBox">

    <div class="preview" id="preview"></div>

    <input type="file" id="fileInput" accept="image/png, image/jpeg" hidden>

    <button class="btn" id="btnPick">Ganti Foto</button>
    <button class="btn" id="btnSave">Simpan</button>

  </div>

</div>
<div id="navbar-container"></div>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
<script src="navbar.js"></script>
<script src="profil.js"></script>

</body>
</html>
