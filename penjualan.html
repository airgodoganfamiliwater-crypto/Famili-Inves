<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="penjualan.css">
<link rel="stylesheet" href="navbar.css">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="ikon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<title>Penjualan</title>

</head>

<body>

<div class="header"></div>

<div class="container">
  <div class="card">

    <div class="logo-wrap">
      <img src="logofw.png" class="logo">
    </div>

    <div class="title">Data Harian</div>
    <div class="bulan" onclick="openFilter()">
      <span id="textBulan"></span>
      <span class="arrow">›</span>
    </div>

    <table>
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Penjualan</th>
          <th>Pengeluaran</th>
          <th>Margin</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="total" id="totalBox"></div>

  </div>
</div>

<!-- POPUP FILTER -->
<div class="popup" id="popup">
  <div class="popup-content" id="popupContent">
    <div class="popup-title">Filter Periode</div>

    <select id="bulanSelect">
      <option value="0">Januari</option>
      <option value="1">Februari</option>
      <option value="2">Maret</option>
      <option value="3">April</option>
      <option value="4">Mei</option>
      <option value="5">Juni</option>
      <option value="6">Juli</option>
      <option value="7">Agustus</option>
      <option value="8">September</option>
      <option value="9">Oktober</option>
      <option value="10">November</option>
      <option value="11">Desember</option>
    </select>

    <select id="tahunSelect"></select>

    <button onclick="applyFilter()">Terapkan</button>

  </div>
</div>
<!-- POPUP DETAIL -->
<div class="popup" id="popupDetail">
  <div class="popup-content" id="popupDetailContent">

    <div class="popup-title">Detail Pengeluaran</div>

    <div id="detailContent"></div>

  </div>
</div>
<div id="navbar-container"></div>
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="navbar.js"></script>
<script src="penjualan.js"></script>
</body>
</html>
