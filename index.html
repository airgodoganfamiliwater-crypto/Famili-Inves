<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="navbar.css">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="ikon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<title>Home</title>
</head>

<body>

<div class="header"></div>

<!-- ===== HERO ===== -->
<div class="home-card">
  <div class="logo">
    <img src="Logofw.png">
  </div>

  <div>
    <div class="title">FAMILI WATER</div>
    <div class="subtitle" id="greeting">-</div>
    <div class="date" id="todayDate">-</div>
  </div>
</div>

<div class="container">
<!-- ===== SUMMARY ===== -->
<div class="summary">

  <div class="summary-card">
    <div class="label">Total Investasi</div>
    <div class="value" id="sumInvestasi">Rp 0</div>
  </div>

  <div class="summary-card">
    <div class="label">Return</div>
    <div class="value green" id="sumReturn">Rp 0</div>
  </div>

  <div class="summary-card">
    <div class="label">Kepemilikan</div>
    <div class="value" id="sumAsset">0%</div>
  </div>

</div>

<!-- ===== CHART ===== -->
<div class="chart-card">
  <div class="chart-header">
    Performa Bulan Ini
  </div>
  <canvas id="myChart"></canvas>
</div>

<!-- ===== LAST REPORT ===== -->
<div class="report-card">

  <div class="report-date" id="reportDate">-</div>

  <div class="report-grid">

    <div class="report-item">
      <div class="report-label">Closing</div>
      <div class="report-value" id="rClosing">0</div>
    </div>

    <div class="report-item">
      <div class="report-label">Omset</div>
      <div class="report-value" id="rOmset">Rp 0</div>
    </div>

    <div class="report-item">
      <div class="report-label">Pengeluaran</div>
      <div class="report-value red" id="rPengeluaran">Rp 0</div>
    </div>

    <div class="report-item">
      <div class="report-label">Margin</div>
      <div class="report-value green" id="rMargin">Rp 0</div>
    </div>

  </div>

</div>
<div class="monthly-card">

  <div class="monthly-header">
    Ringkasan Bulan Ini
  </div>

  <div class="monthly-grid">

    <div class="monthly-item">
      <div class="monthly-label">Total Closing</div>
      <div class="monthly-value" id="mKlien">0</div>
    </div>

    <div class="monthly-item">
      <div class="monthly-label">Total Margin</div>
      <div class="monthly-value green" id="mMargin">Rp 0</div>
    </div>

  </div>

</div>
<!-- ===== NOTED ===== -->
<div class="noted-card">

  <div class="noted-header">
    Noted
  </div>

  <div class="noted-date" id="notedDate">-</div>

  <div class="noted-image" id="notedImage"></div>

  <div class="noted-content" id="notedContent">-</div>

</div>
</div>
<div id="navbar-container"></div>
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="navbar.js"></script>
<script src="index.js"></script>
</body>
</html>
